# Run this workflow on demand and every time a new commit pushed to your repository
on:
  pull_request:
  workflow_dispatch:

jobs:
  # Set the job key. The key is displayed as the job name
  # when a job name is not provided
  public-docs:
    if: ${{ github.event.pull_request.head.ref != 'documentation' }}
    # Name the Job
    name: Publish the ce-provision docs to GitHub
    # Set the type of machine to run on
    runs-on: ubuntu-latest

    # Use our ce-dev Debian base container
    container:
      image: codeenigma/ce-dev-controller:2.x
      volumes:
        - ${{ github.workspace }}:/home/controller

    steps:
      - name: Install wiki2pages
        run: /usr/bin/git clone https://github.com/codeenigma/wikis2pages.git

      - name: Set up Ansible hosts file
        run: |
          mkdir -p /home/ce-dev/ansible/bin/hosts
          echo "wikis2pages-hugo ansible_host=127.0.0.1" > /home/ce-dev/ansible/bin/hosts/hosts

      - name: Start SSHD
        run: /usr/sbin/sshd&

      - name: Initialise wiki2pages for ce-provision 2.x
        run: |
          cd wikis2pages
          /bin/sh init.sh --repo https://github.com/codeenigma/ce-provision.git --branch 2.x --no-ce-dev
          /home/ce-dev/ansible/bin/ansible-playbook -i  /home/ce-dev/ansible/bin/hosts ce-dev/ansible/provision.yml
          /bin/sh set-current.sh ce-provision-2.x --no-ce-dev
          /home/ce-dev/ansible/bin/ansible-playbook -i  /home/ce-dev/ansible/bin/hosts ce-dev/ansible/deploy.yml
          ls -la public/
          ls -la public/ce-provision-2.x/
