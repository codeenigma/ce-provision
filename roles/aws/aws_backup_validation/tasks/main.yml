---
- name: Create a role and attach policies for Lambda backup validation.
  ansible.builtin.include_role:
    name: aws/aws_iam_role
  vars:
    aws_iam_role:
      name: LambdaBackupRestoreRole
      managed_policies:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
        - arn:aws:iam::aws:policy/AWSBackupFullAccess
        - arn:aws:iam::aws:policy/AmazonRDSFullAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AmazonSESFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
      policy_document: "{{ lookup('file', 'trusted_entitites.j2') }}"

- name: Assign IAM role var.
  ansible.builtin.set_fact:
    _created_iam_lambda_role: "{{ _aws_iam_role_result }}"

- name: Create an IAM Managed Policy for passing roles and setup IAM role.
  ansible.builtin.include_role:
    name: aws/aws_iam_role
  vars:
    aws_iam_role:
      name: AWSBackupDefaultServiceRole
      inline_policies:
        name: "PassRole"
        resource: "*"
        action: "iam:PassRole"
      policy_document: "{{ lookup('file', 'pass_role_backup.j2') }}"
      managed_policies:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores

- name: Assign IAM role var.
  ansible.builtin.set_fact:
    _pass_role: "{{ _aws_iam_role_result }}"

# TODO: Not all clients have verified identity
#- name: Get verified domain.
#  ansible.builtin.include_tasks: get_valid_email.yml

- name: Clear aws_lambda variable.
  ansible.builtin.set_fact:
    aws_lambda: ""

- name: Create backup validation Lambda functions.
  ansible.builtin.include_role:
    name: aws/aws_lambda
  vars:
    aws_lambda:
      name: "{{ aws_backup_validation.name }}_{{ item }}"
      description: "{{ aws_backup_validation.description }}"
      timeout: "{{ aws_backup_validation.timeout }}"
      role: "{{ _created_iam_lambda_role.iam_role }}"
      runtime: "{{ aws_backup_validation.runtime }}"
      tags:
        Name: "{{ item }}_backup_validation"
  loop: "{{ aws_backup_validation.resources }}"

- name: Create validation report function.
  ansible.builtin.include_role:
    name: aws/aws_lambda
  vars:
    aws_lambda:
      name: "validation_report"
      description: "{{ aws_backup_validation.description }}"
      timeout: "30"
      role: "{{ _created_iam_lambda_role.iam_role }}"
      runtime: "{{ aws_backup_validation.runtime }}"
      tags:
        Name: "validation_report"

- name: Remove non UTF-8 items.
  ansible.builtin.set_fact:
    aws_lambda: "{{ aws_lambda | ansible.utils.remove_keys(target=['ZipFile', 'location', 'item.invocation']) }}"

- name: Create EventBridge for validation functions.
  amazon.aws.cloudwatchevent_rule:
    name: "{{ aws_lambda._result[item + '_validation'].configuration.function_name }}"
    description: "{{ aws_lambda._result[item + '_validation'].configuration.description }}"
    state: present
    region: "{{ _aws_region }}"
    event_pattern: '{ "source": ["aws.backup"], "detail-type": ["Restore Job State Change"], "detail": { "resourceType": ["' + "{{ aws_lambda._result[item + '_validation'].item }} + '"], "status": ["COMPLETED"] } }'
    targets:
      - id: "{{ aws_lambda._result[item + '_validation'].configuration.function_name }}"
        arn: "{{ (aws_lambda._result[item + '_validation'].configuration.function_arn.split(':') | map('trim'))[:-1] | join(':') }}" # Remove the version number from ARN
  register: _event_bridges
  loop: "{{ aws_backup_validation.resources }}"

- name: Create schedule for validation reports
  amazon.aws.cloudwatchevent_rule:
    name: validation_report
    schedule_expression: "cron(0 0 ? * MON *)"
    description: Run validation reporting
    region: "{{ _aws_region }}"
    targets:
      - id: validation_report
        arn: "{{ (aws_lambda._result['validation_report'].configuration.function_arn.split(':') | map('trim'))[:-1] | join(':') }}" # Remove the version number from ARN
  register: _validation_event

- name: Generate unique string
  ansible.builtin.set_fact:
    _rand_str: "{{ lookup('community.general.random_string', length=8, special=false, min_lower=2, min_numeric=2, min_upper=2) }}"

- name: Update Lambda policy
  amazon.aws.lambda_policy:
    state: present
    function_name: "{{ item.item.configuration.function_name }}"
    statement_id: "{{ item.item.configuration.function_name }}_{{ _rand_str }}"
    action: lambda:InvokeFunction
    principal: events.amazonaws.com
    source_arn: "{{ item.rule.arn }}"
    region: "{{ _aws_region }}"
  loop: "{{ _event_bridges.results }}"

- name: Update lambda validation report policy
  amazon.aws.lambda_policy:
    state: present
    function_name: "validation_report"
    statement_id: "{{ aws_lambda._result['validation_report'].configuration.function_name }}_{{ _rand_str }}"
    action: lambda:InvokeFunction
    principal: events.amazonaws.com
    source_arn: "{{ _validation_event.rule.arn }}"
    region: "{{ _aws_region }}"
