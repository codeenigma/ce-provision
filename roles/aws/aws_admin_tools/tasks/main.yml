- name: List all API gateways.
  community.aws.api_gateway_info:
    region: "{{ _aws_region }}"
  register: _api_gate_list

- name: Find the index of admin tools API
  ansible.builtin.set_fact:
    _api_index: "{{ lookup('ansible.utils.index_of', _api_gate_list['rest_apis'], 'eq', _aws_profile + '_admin_tools', 'name', wantlist=True) }}"

