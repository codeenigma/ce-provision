- name: List all API gateways.
  community.aws.api_gateway_info:
    region: "{{ _aws_region }}"
  register: _api_gate_list

- name: Find the index of admin tools API
  ansible.builtin.set_fact:
    _api_index: "{{ lookup('ansible.utils.index_of', _api_gate_list['rest_apis'], 'eq', _aws_profile + '_admin_tools', 'name', wantlist=True) }}"

- name: Create API gateway
  ansible.builtin.command: >-
    aws apigateway create-rest-api
    --region "{{ _aws_region }}"
    --name "{{ _aws_profile }}_admin_tools"
    --description "API for administration functions made automatically by ansible"
    --endpoint-configuration "{\"types\": [\"REGIONAL\"]}"
  register: _api_gate
  when: _api_index | length == 0

- name: Setting prevoius command output into variable
  ansible.builtin.set_fact:
    _api_gate: "{{ _api_gate.stdout | from_json }}"
  when: _api_index | length == 0

- name: Setting _api_index if API already exists
  ansible.builtin.set_fact:
    _api_gate: "{{ _api_gate_list.rest_apis[_api_index] }}"
  when: _api_index | length > 0

- name: Create initial deployent for API gateway
  ansible.builtin.command: >-
    aws apigateway create-deployment
    --rest-api-id "{{ _api_gate.id }}"
    --region "{{ _aws_region }}"
  register: _main_api_deploy

- name: Setting prevoius command output into variable
  ansible.builtin.set_fact:
    _main_api_deploy: "{{ _main_api_deploy.stdout | from_json }}"

- name: Configure Lambda IAM policies.
  ansible.builtin.include_tasks: lambda_iam.yml
  loop: "{{ aws_admin_tools.functions }}"

- name: Sleep for 5 seconds for IAM roles.
  ansible.builtin.wait_for:
    timeout: 5

- name: Configure Lambda functions.
  ansible.builtin.include_tasks: lambda_functions.yml
  loop: "{{ aws_admin_tools.functions }}"

- name: Create WAF for API Gateway
  ansible.builtin.include_role:
    name: aws/aws_acl
  vars:
    aws_acl:
      - name: "{{ _aws_profile }}_admin_tools"
        description: "ACL rules for API Gateway"
        scope: REGIONAL
        region: "{{ _aws_region }}"
        tags: "{{ _aws_tags }}"
        recreate: true
        rules:
          ip_sets:
            - rule_name: "{{ _aws_profile }}_admin_tools"
              set_name: "{{ _aws_profile }}_admin_tools"
              description: "List of IPs to allow using API - Ansible managed"
              action: allow
              priority: 1
              list: "{{ aws_admin_tools.allowed_ips }}"

- name: Create API Gateway.
  ansible.builtin.include_tasks: create.yml
  when: _api_index | length == 0

- name: Update API Gateway.
  ansible.builtin.include_tasks: update.yml
  when: _api_index | length > 0

