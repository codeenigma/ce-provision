- name: Setup AWS API Gateway setup on AWS and deploy API definition
  community.aws.api_gateway:
    name: "{{ _aws_profile }}_AdminAPI"
    region: "{{ _aws_region }}"
    swagger_text: "{{ lookup('template', 'swag.yml.j2') }}"
    stage: prod
    tracing_enabled: true
    endpoint_type: REGIONAL
    state: present

