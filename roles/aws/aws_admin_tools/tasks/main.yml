- name: Write swag file
  ansible.builtin.template:
    src: "swag.json.j2"
    dest: "/tmp/swag.json"

- name: Create API gateway
  community.aws.aws_api_gateway:
    state: present
    region: "{{ aws_region }}"
    swagger_file: "/tmp/swag.json"
    stage: prod
    deploy_desc: Production Deployment
  register: apigateway_result

- name: Create WAF for API Gateway
  ansible.builtin.include_role:
    name: aws/aws_acl
  vars:
    aws_acl:
      - name: "{{ _aws_profile }}_admin_tools"
        description: "ACL rules for API Gateway"
        scope: REGIONAL
        region: "{{ _aws_region }}"
        tags: "{{ _aws_tags }}"
        recreate: true
        rules:
          ip_sets:
            - rule_name: "{{ _aws_profile }}_admin_tools"
              set_name: "{{ _aws_profile }}_admin_tools"
              description: "List of IPs to allow using API - Ansible managed"
              action: allow
              priority: 1
              list: "{{ aws_admin_tools.allowed_ips }}"

