- name: Get appropriate IAM role for Lambda.
  amazon.aws.iam_role_info:
    name: "{{ item.resource }}_{{ item.name }}"
  register: _iam_lambda

- name: Create backup validation Lambda functions.
  ansible.builtin.include_role:
    name: aws/aws_lambda
  vars:
    aws_lambda:
      name: "{{ item.resource }}_{{ item.name }}"
      description: "Lambda function for {{ item.name }}"
      timeout: "{{ item.timeout | default(aws_admin_tools.timeout) }}"
      role: "{{ _iam_lambda.iam_roles[0].arn }}"
      runtime: "{{ aws_admin_tools.runtime }}"
      function_file: "{{ lookup('template', item.resource + '_' + item.name + '.py.j2') }}"
      s3_bucket: "ce-{{ _aws_profile }}-lambda-functions"
      tags:
        Name: "{{ item.resource }}_{{ item.name }}"
