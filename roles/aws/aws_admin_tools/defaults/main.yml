aws_admin_tools:
  runtime: "python3.12"
  timeout: 20
  allowed_ips:
    - 192.168.1.1/32 # Ip of server with access to API-s
  functions:
    - name: "GetForecastedCosts"
      type: GET
      policies:
        - "arn:aws:iam::{{ _acc_id }}:policy/CEBillingPolicy" # Custom policy
    - name: "ChangeASGScaling"
      type: POST
      policies:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
    - name: "GetListOfEC2"
      type: GET
      policies:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
