aws_admin_tools:
  runtime: "python3.12"
  timeout: 20
  allowed_ips:
    - 192.168.1.1/32 # Ip of server with access to API-s
  functions:
    - name: "Get_Forecasted_Costs"
      type: GET
      inline_policies:
        name: "{{ _aws_profile }}Billing"
        resource: "*"
        action:
          - "ce:*"
      policies: []
    - name: "Change_ASG_Scaling"
      type: POST
      policies:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
    - name: "Get_List_Of_EC2"
      type: GET
      policies: []
      inline_policies:
        name: "ListEc2"
        resource: "*"
        action:
          - "ec2:DescribeAddresses"
          - "ec2:DescribeInstances"
    - name: "Get_IP_Set"
      type: GET
      policies: []
      inline_policies:
        name: "Get_IP_Set"
        resource: "*"
        action:
          - "wafv2:GetIPSet"
    - name: "Update_IP_Set"
      type: POST
      policies: []
      inline_policies:
        name: "Update_IP_Set"
        resource: "*"
        action:
          - "wafv2:UpdateIPSet"
