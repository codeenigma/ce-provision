aws_admin_tools:
  runtime: "python3.12"
  timeout: 20
  allowed_ips:
    - 3.11.82.252/32 # Ip of server with access to API-s
  functions:
    - name: "GetForecastedCosts"
      type: GET
      policies:
        - "arn:aws:iam::aws:policy/job-function/Billing"
    - name: "ChangeASGScaling"
      type: POST
      policies:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
    - name: "GetListOfEC2"
      type: GET
      policies:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
