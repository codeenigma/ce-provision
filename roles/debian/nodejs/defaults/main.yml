---
nodejs:
  # Used by apt_unattended_upgrades
  apt_origin_nodejs: "{% if nodejs.version != '10.x' %}origin=. nodistro,codename=nodistro,label=. nodistro{% else %}origin=Node Source,codename=${distro_codename},label=Node Source{% endif %}"
  apt_signed_by_nodejs: "{% if nodejs.version != '10.x' %}https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key{% else %}https://deb.nodesource.com/gpgkey/nodesource.gpg.key{% endif %}"
  apt_origin_yarn: "origin=yarn,codename=stable,label=yarn-stable" # yarn repo
  apt_signed_by_yarn: https://dl.yarnpkg.com/debian/pubkey.gpg
  version: 18.x # LTS - see https://nodejs.dev/en/about/releases/
  npm_packages: []
  #npm_packages:
  #  - name: coffee-script # required
  #    version: "1.6.1"
  #    path: /path/to/node/app # omit to install globally
