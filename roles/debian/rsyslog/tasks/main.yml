---
- name: Install rsyslog with apt
  ansible.builtin.apt:
    name: rsyslog
    state: present
    update_cache: true

- name: Copy rsyslog configuration in place.
  ansible.builtin.template:
    src: "rsyslog.{{ rsyslog.role }}.conf.j2"
    dest: "/etc/rsyslog.conf"
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Debug systemd unit files
  ansible.builtin.shell: "systemctl list-unit-files --type=service | grep rsyslog || echo 'not found'"
  register: rsyslog_unit_files
  changed_when: false

- name: Show systemd unit files debug
  ansible.builtin.debug:
    msg: "Systemd unit files: {{ rsyslog_unit_files.stdout }}"

- name: Debug active services
  ansible.builtin.shell: "systemctl list-units --type=service | grep rsyslog || echo 'not found'"
  register: rsyslog_active_services
  changed_when: false

- name: Show active services debug
  ansible.builtin.debug:
    msg: "Active systemd services: {{ rsyslog_active_services.stdout }}"

- name: Check SysV services
  ansible.builtin.shell: "service --status-all | grep rsyslog || echo 'not found'"
  register: rsyslog_sysv_services
  changed_when: false

- name: Show SysV services debug
  ansible.builtin.debug:
    msg: "SysV service status: {{ rsyslog_sysv_services.stdout }}"
