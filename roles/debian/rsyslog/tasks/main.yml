---
- name: Install rsyslog with apt
  ansible.builtin.apt:
    name: rsyslog
    state: present
    update_cache: true

- name: Copy rsyslog configuration in place.
  ansible.builtin.template:
    src: "rsyslog.{{ rsyslog.role }}.conf.j2"
    dest: "/etc/rsyslog.conf"
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Restart rsyslog service
  ansible.builtin.service:
    name: rsyslog
    state: restarted
