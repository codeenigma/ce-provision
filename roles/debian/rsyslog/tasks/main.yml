---
- name: Install rsyslog with apt
  ansible.builtin.apt:
    name: rsyslog
    state: present
    update_cache: true

- name: Copy rsyslog configuration in place.
  ansible.builtin.template:
    src: "rsyslog.{{ rsyslog.role }}.conf.j2"
    dest: "/etc/rsyslog.conf"
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Check if rsyslog init script exists (SysVinit)
  ansible.builtin.stat:
    path: /etc/init.d/rsyslog
  register: rsyslog_init

- name: Debug init.d existence
  ansible.builtin.debug:
    msg: "Init script exists: {{ rsyslog_init.stat.exists }}"

- name: Restart rsyslog via SysVinit if available
  ansible.builtin.sysvinit:
    name: rsyslog
    state: restarted
  when: rsyslog_init.stat.exists

- name: Restart rsyslog via systemd if init.d not available
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
    enabled: true
  when: not rsyslog_init.stat.exists
