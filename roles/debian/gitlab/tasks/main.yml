---
- name: Add DNS records.
  when:
    - gitlab.gitlab_route_53.zone is defined
    - gitlab.gitlab_route_53.zone | length > 0
  block:
    - name: Add a DNS record for GitLab.
      amazon.aws.route53:
        state: "{{ gitlab.gitlab_route_53.state }}"
        profile: "{{ gitlab.gitlab_route_53.aws_profile }}"
        zone: "{{ gitlab.gitlab_route_53.zone }}"
        record: "{{ gitlab.server_name }}"
        type: "{{ gitlab.gitlab_route_53.type }}"
        value: "{{ gitlab.gitlab_route_53.value }}"
        overwrite: true
      delegate_to: localhost
      become: false

    - name: Add a DNS record for Mattermost.
      amazon.aws.route53:
        state: "{{ gitlab.mattermost_route_53.state }}"
        profile: "{{ gitlab.mattermost_route_53.aws_profile }}"
        zone: "{{ gitlab.mattermost_route_53.zone }}"
        record: "{{ gitlab.mattermost_url }}"
        type: CNAME
        value: "{{ gitlab.server_name }}"
        overwrite: true
      delegate_to: localhost
      become: false
      when: gitlab.mattermost

- name: Add GitLab repository and key.
  ansible.builtin.include_role:
    name: debian/apt_repository
  vars:
    apt_repository:
      legacy_repo: "deb https://packages.gitlab.com/gitlab/gitlab-ce/debian/ {{ ansible_distribution_release }} main"
      format: deb822
      name: gitlab
      types:
        - deb
        - deb-src
      uris:
        - https://packages.gitlab.com/gitlab/gitlab-ce/debian/
      signed_by: "{{ gitlab.apt_signed_by }}"
      suites: "{{ ansible_distribution_release }}"
      components:
        - main
      state: present
      enabled: true
      key_refresh_timer_OnCalendar: "Mon *-*-* 00:20:00"

- name: Set up unattended-upgrades.
  when:
    - apt_unattended_upgrades.enable is defined
    - apt_unattended_upgrades.enable
  block:
    - name: Add GitLab repository to unattended-upgrades origins list.
      ansible.builtin.set_fact:
        _apt_unattended_upgrades_default_origins: "{{ _apt_unattended_upgrades_default_origins + [gitlab.apt_origin] }}"

    - name: Install the unattended-upgrades config.
      ansible.builtin.include_role:
        name: debian/apt_unattended_upgrades

- name: Ensure Gitlab is installed.
  ansible.builtin.apt:
    pkg: "gitlab-ce"
    state: present
    update_cache: true

- name: Generates SSL keys.
  ansible.builtin.include_role:
    name: debian/ssl
  when: gitlab.ssl.enabled
  vars:
    ssl: "{{ gitlab.ssl | combine({'domain': gitlab.server_name}) }}"

- name: Copy Gitlab configuration file.
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb

- name: Copy Gitlab configuration script.
  ansible.builtin.template:
    src: gitlab-config.rb.j2
    dest: /etc/gitlab/gitlab-config.rb

- name: Let Gitlab know it's on Docker.
  ansible.builtin.copy:
    content: "gitlab-docker"
    dest: "/opt/gitlab/embedded/service/gitlab-rails/INSTALLATION_TYPE"
    mode: "0666"
  when: is_local

- name: Stop Sidekiq specifically first
  ansible.builtin.command:
    cmd: /opt/gitlab/bin/gitlab-ctl stop sidekiq
  register: sidekiq_stop
  ignore_errors: true
  async: 180
  poll: 5

- name: Force stop Sidekiq if it's stuck.
  ansible.builtin.command:
    cmd: /opt/gitlab/bin/gitlab-ctl kill sidekiq
  when: sidekiq_stop is failed

- name: Stop Gitlab.
  ansible.builtin.command: /opt/gitlab/bin/gitlab-ctl stop
  when: gitlab.force_stop

- name: Reconfigure Gitlab.
  ansible.builtin.command: /opt/gitlab/bin/gitlab-ctl reconfigure
  when: not is_local

- name: Copy startup script in place.
  ansible.builtin.template:
    src: docker-init.sh.j2
    dest: "/opt/gitlab-init.sh"
    owner: root
    group: root
    mode: "0555"
    force: true
  when: is_local

- name: Trigger overrides.
  ansible.builtin.include_role:
    name: _overrides
  vars:
    _overrides: "{{ gitlab.overrides }}"
  when:
    - gitlab.overrides is defined
    - gitlab.overrides | length > 0

- name: Manually restart Gitlab/Docker.
  ansible.builtin.command: "/bin/sh /opt/gitlab-init.sh"
  when: is_local

- name: Ensure GitLab is started.
  ansible.builtin.command: /opt/gitlab/bin/gitlab-ctl start
  when: gitlab.force_stop

- name: Create systemd timer to sync removed LDAP users.
  ansible.builtin.include_role:
    name: contrib/systemd_timers
  vars:
    timers:
      block_removed_ldap_users:
        timer_command: "/usr/bin/gitlab-rake gitlab:cleanup:block_removed_ldap_users BLOCK=true"
        timer_OnCalendar: "{{ gitlab.block_removed_ldap_users_on_calendar }}"
  when: gitlab.ldap.enable

# Set up LE renewal timer and service on boot for servers that are shut down overnight.

- name: Check if GitLab is installed
  ansible.builtin.stat:
    path: /opt/gitlab/bin/gitlab-ctl
  register: gitlab_ctl_binary

- name: Configure GitLab LE boot-time renewal timer
  when:
    - gitlab.letsencrypt_timer
    - gitlab_ctl_binary.stat.exists
  block:
    - name: Install systemd service for LE renewal
      ansible.builtin.template:
        src: gitlab-renew-le.service.j2
        dest: /etc/systemd/system/gitlab-renew-le.service
        owner: root
        group: root
        mode: '0644'

    - name: Install systemd timer for LE renewal
      ansible.builtin.template:
        src: gitlab-renew-le.timer.j2
        dest: /etc/systemd/system/gitlab-renew-le.timer
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: is_local is not defined or not is_local

    - name: Enable and start the LE renewal timer
      ansible.builtin.systemd:
        name: gitlab-renew-le.timer
        enabled: true
        state: started
      when: is_local is not defined or not is_local

# @TODO - this task fails in CI with GitHub Actions because PostGreSQL isn't running
- name: Run the GitLab configuration script for config that cannot be set in gitlab.rb.
  ansible.builtin.command: /opt/gitlab/bin/gitlab-rails runner /etc/gitlab/gitlab-config.rb
  when: not is_local
