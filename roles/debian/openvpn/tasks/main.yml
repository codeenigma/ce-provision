---
- name: Download latest openvpn-install script.
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/angristan/openvpn-install/master/openvpn-install.sh
    dest: "{{ openvpn.script_install_path }}/openvpn-install.sh"
    mode: '0750'
    owner: "{{ user_provision.username }}"
    group: "{{ user_provision.username }}"
    force: true

- name: Update network options in the OpenVPN install script.
  when: openvpn.ipv4_settings | length > 0
  block:
    - name: Set base network vars.
      ansible.builtin.set_fact:
        ovpn_net: "{{ openvpn.ipv4_settings.split(' ')[0] }}"
        ovpn_mask: "{{ openvpn.ipv4_settings.split(' ')[1] }}"

    - name: Set calculated network prefix.
      ansible.builtin.set_fact:
        ovpn_prefix: "{{ (ovpn_net ~ '/' ~ ovpn_mask) | ansible.utils.ipaddr('prefix') }}"

    - name: Set calculated network cidr.
      ansible.builtin.set_fact:
        ovpn_cidr: "{{ ovpn_net }}/{{ ovpn_prefix }}"

    - name: Set calculated network gateway.
      ansible.builtin.set_fact:
        ovpn_gateway: "{{ ovpn_cidr | ansible.utils.ipaddr('first_usable') }}"

    - name: Show final derived values.
      ansible.builtin.debug:
        msg:
          ovpn_prefix: "{{ ovpn_prefix }}"
          ovpn_cidr: "{{ ovpn_cidr }}"
          ovpn_gateway: "{{ ovpn_gateway }}"

    - name: Replace OpenVPN server network.
      ansible.builtin.lineinfile:
        path: "{{ openvpn.script_install_path }}/openvpn-install.sh"
        search_string: 'server 10.8.0.0 255.255.255.0'
        line: "server {{ openvpn.ipv4_settings }}"

    - name: Replace 10.8.0.0/24 with new CIDR.
      ansible.builtin.replace:
        path: "{{ openvpn.script_install_path }}/openvpn-install.sh"
        regexp: '\b10\.8\.0\.0/24\b'
        replace: '{{ ovpn_cidr }}'

    - name: Replace 10.8.0.1/24 with new gateway/mask.
      ansible.builtin.replace:
        path: "{{ openvpn.script_install_path }}/openvpn-install.sh"
        regexp: '\b10\.8\.0\.1/24\b'
        replace: '{{ ovpn_gateway }}/{{ ovpn_prefix }}'

    - name: Replace bare 10.8.0.1 with new gateway.
      ansible.builtin.replace:
        path: "{{ openvpn.script_install_path }}/openvpn-install.sh"
        regexp: '(?<=\s)10\.8\.0\.1(?=[\s"|]|$)'
        replace: '{{ ovpn_gateway }}'

- name: Place the headless installer script.
  ansible.builtin.template:
    src: headless-openvpn-install.sh.j2
    dest: "{{ openvpn.script_install_path }}/headless-openvpn-install.sh"
    mode: "0750"
    owner: "{{ user_provision.username }}"
    group: "{{ user_provision.username }}"

- name: Attempt to install OpenVPN in headless mode.
  ansible.builtin.command:
    cmd: "{{ openvpn.script_install_path }}/headless-openvpn-install.sh"
  when: openvpn.auto_install

# Tweak server config
- name: Allow multiple simultaneous VPN connections.
  ansible.builtin.lineinfile:
    path: /etc/openvpn/server.conf
    line: duplicate-cn
  when: openvpn.multiple_connections
  notify: Restart OpenVPN.

- name: Allow client IP to float without disconnecting.
  ansible.builtin.lineinfile:
    path: /etc/openvpn/server.conf
    line: float
  when: openvpn.allow_floating_client_ip
  notify: Restart OpenVPN.

- name: Set a different server cipher.
  when: openvpn.cipher | length > 0
  block:
    - name: Replace OpenVPN cipher on the server.
      ansible.builtin.lineinfile:
        path: /etc/openvpn/server.conf
        search_string: 'cipher AES-128-GCM'
        line: "cipher {{ openvpn.cipher }}"
        owner: root
        group: root
        mode: '0644'

    - name: Replace OpenVPN ncp-ciphers on the server.
      ansible.builtin.lineinfile:
        path: /etc/openvpn/server.conf
        search_string: 'ncp-ciphers AES-128-GCM'
        line: "ncp-ciphers {{ openvpn.cipher }}"
        owner: root
        group: root
        mode: '0644'
      notify: Restart OpenVPN.

# Removing duplicate lines created by the openvpn-install during multiple runs.
- name: Ensure exactly one include of openvpn.conf when Unbound is used.
  ansible.builtin.replace:
    path: /etc/unbound/unbound.conf
    regexp: '(?m)^(?:include: /etc/unbound/openvpn\.conf\s*\n?)+'
    replace: "include: /etc/unbound/openvpn.conf\n"
  when: openvpn.dns == "2"

# Push routes
- name: Set up ipv4 push routes.
  when: openvpn.push_routes_ipv4 | length > 0
  block:
    - name: Remove default push-route.
      ansible.builtin.lineinfile:
        path: /etc/openvpn/server.conf
        search_string: 'redirect-gateway'
        state: absent
        owner: root
        group: root
        mode: '0644'

    - name: Add ipv4 push routes comment for readability.
      ansible.builtin.lineinfile:
        path: /etc/openvpn/server.conf
        line: "# ipv4 push routes"

    - name: Add ipv4 push routes to the VPN.
      ansible.builtin.lineinfile:
        path: /etc/openvpn/server.conf
        line: 'push "route {{ item }}"'
      with_items: "{{ openvpn.push_routes_ipv4 }}"
      notify: Restart OpenVPN.

- name: Set up ipv6 push routes.
  when:
    - openvpn.push_routes_ipv6 | length > 0
    - openvpn.ipv6_support == "y"
  block:
    - name: Add ipv6 push routes comment for readability.
      ansible.builtin.lineinfile:
        path: /etc/openvpn/server.conf
        line: "# ipv6 push routes"

    - name: Add ipv6 push routes to the VPN.
      ansible.builtin.lineinfile:
        path: /etc/openvpn/server.conf
        line: 'push "route-ipv6  {{ item }}"'
      with_items: "{{ openvpn.push_routes_ipv6 }}"
      notify: Restart OpenVPN.

# You can use a 'DEFAULT' file in the specified directory to provide client-specifig config, such as managed push routes
- name: Add another client config directory.
  when: openvpn.client_config_dir | length > 0
  block:
    - name: Remove default push-route.
      ansible.builtin.lineinfile:
        path: /etc/openvpn/server.conf
        search_string: 'redirect-gateway' # this string is absent by default, leaving the task for now just in case.
        state: absent
        owner: root
        group: root
        mode: '0644'
      when: openvpn.client_config_push_routes

    - name: Create client config directory if it doesn't exist.
      ansible.builtin.file:
        path: "{{ openvpn.client_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Add client config directory to config if path is provided.
      ansible.builtin.lineinfile:
        path: /etc/openvpn/server.conf
        line: "client-config-dir {{ openvpn.client_config_dir }}"

# PAM integration
- name: Ensure the OpenVPN PAM config is in place.
  ansible.builtin.template:
    src: "{{ openvpn.pam.config_template }}"
    dest: /etc/pam.d/openvpn
    mode: "0644"
    owner: root
    group: root
  when: openvpn.pam.enabled

# PAM integration using LDAP
- name: Set up PAM integration with LDAP.
  when: openvpn.ldap.enabled
  block:
    - name: Ensure the OpenVPN PAM config for LDAP is in place.
      ansible.builtin.template:
        src: "{{ openvpn.ldap.config_template }}"
        dest: /etc/pam.d/openvpn
        mode: "0644"
        owner: root
        group: root

    - name: Ensure the OpenVPN LDAP config directory exists.
      ansible.builtin.file:
        path: /etc/openvpn/ldap
        state: directory
        mode: '0755'

    - name: Ensure the pam-ldap config for OpenVPN is in place.
      ansible.builtin.template:
        src: openvpn.ldap.j2
        dest: /etc/openvpn/ldap/ldap
        mode: "0644"
        owner: root
        group: root

# Enable PAM in OpenVPN
- name: Add PAM integration config to OpenVPN.
  ansible.builtin.blockinfile:
    path: /etc/openvpn/server.conf
    block: |
      # Let OpenVPN use PAM for authentication
      plugin {{ openvpn.pam.module_path }} openvpn
  when: openvpn.pam.enabled or openvpn.ldap.enabled
  notify: Restart OpenVPN.

# Tweak client config template
- name: Set a different TLS cipher for client template and server.
  when: openvpn.tls_cipher | length > 0
  block:
    - name: Replace OpenVPN client tls-cipher.
      ansible.builtin.lineinfile:
        path: /etc/openvpn/client-template.txt
        search_string: 'tls-cipher TLS-ECDHE-ECDSA-WITH-AES-128-GCM-SHA256'
        line: "tls-cipher {{ openvpn.tls_cipher }}"
        owner: root
        group: root
        mode: '0644'

    - name: Replace OpenVPN client cipher.
      ansible.builtin.lineinfile:
        path: /etc/openvpn/client-template.txt
        search_string: 'cipher AES-128-GCM'
        line: "cipher {{ openvpn.cipher }}"
        owner: root
        group: root
        mode: '0644'

    - name: Replace OpenVPN server tls-cipher.
      ansible.builtin.lineinfile:
        path: /etc/openvpn/server.conf
        search_string: 'tls-cipher TLS-ECDHE-ECDSA-WITH-AES-128-GCM-SHA256'
        line: "tls-cipher {{ openvpn.tls_cipher }}"
        owner: root
        group: root
        mode: '0644'
      notify: Restart OpenVPN.

# Update routes with non-persistent IP addresses, such as Loadbalancers. Because 'allow_pull_fqdn' may not work properly.
- name: Install a script to update routes with non-persistent IP addresses.
  when: openvpn.push_routes_elb | length > 0
  block:
    - name: Place the ELB-routes updater script.
      ansible.builtin.template:
        src: update-elb-routes.sh.j2
        dest: /usr/local/bin/update-elb-routes.sh
        mode: '0755'

    - name: Install systemd service unit for ELB-routes updater.
      ansible.builtin.copy:
        dest: /etc/systemd/system/update-elb-routes.service
        content: |
          #
          # Managed by ansible
          # Role: systemd-timer
          #
          [Unit]
          Description=Update ELB routes for OpenVPN Service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/update-elb-routes.sh
      notify: Reload systemd.

    - name: Install systemd timer unit for ELB-routes updater.
      ansible.builtin.copy:
        dest: /etc/systemd/system/update-elb-routes.timer
        content: |
          #
          # Managed by ansible
          # Role: systemd-timer
          #
          [Unit]
          Description=Update ELB routes for OpenVPN Timer

          [Timer]
          OnUnitActiveSec={{ openvpn.elb_routes_update_interval | default('1h') }}
          Persistent=false
          AccuracySec=300s

          [Install]
          WantedBy=timers.target
      notify: Reload systemd.

    - name: Enable & start update-elb-routes timer.
      ansible.builtin.systemd_service:
        name: update-elb-routes.timer
        enabled: true
        state: restarted
        masked: false
        daemon_reload: true

# Only works when openvpn.port_choice == '1' because otherwise port will not be 1194 and regexp will not match
- name: Use FQDN as OpenVPN server remote in client config.
  ansible.builtin.lineinfile:
    path: /etc/openvpn/client-template.txt
    regexp: '^remote (.*) 1194'
    line: "remote {{ openvpn.fqdn }} 1194"
    owner: root
    group: root
    mode: '0644'
  when: openvpn.fqdn | length > 0

- name: Allow FQDN push routes.
  ansible.builtin.lineinfile:
    path: /etc/openvpn/client-template.txt
    line: allow-pull-fqdn
  when: openvpn.allow_pull_fqdn

- name: Enforce username and password authentication.
  ansible.builtin.lineinfile:
    path: /etc/openvpn/client-template.txt
    line: auth-user-pass
  when: openvpn.auth_user_pass

# Installation complete - provide user information
- name: Service notice.
  ansible.builtin.debug:
    msg: "OpenVPN is ready to use, to manage the server run {{ openvpn.script_install_path }}/openvpn-install.sh as root."
